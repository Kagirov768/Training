нав b{font-size:20px;line-height:22px}.нав.активен{color:var(--акцент)}.вкладки{display:flex;gap:7px;overflow:auto;padding:2px 0 9px;scrollbar-width:none}.вкладка{white-space:nowrap;border:1px solid var(--линия);background:var(--карта);color:var(--втор);border-radius:99px;padding:9px 13px;font-size:12px;font-weight:800;cursor:pointer}.вкладка.активна{color:white;border-color:var(--текст);background:var(--текст)}.календарь-шапка{display:flex;justify-content:space-between;align-items:center}.месяц-сетка{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.день-нед{font-size:11px;color:var(--втор);padding:8px 0}.дата{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--текст);font-size:13px;position:relative;cursor:pointer}.дата.план{background:color-mix(in srgb,var(--син) 9%,transparent)}.дата.готово{background:var(--зел);color:#fff;font-weight:900}.дата.пропуск{box-shadow:inset 0 0 0 2px #dc4e4e}.дата.сегодня{outline:2px solid var(--акцент);outline-offset:1px}.дата.иная{opacity:.25}.точка{width:4px;height:4px;background:var(--акцент);border-radius:50%;position:absolute;bottom:4px;left:calc(50% - 2px)}.раздел-упр{border-top:1px solid var(--линия);padding:14px 0}.раздел-упр:first-child{border:0}.параметры{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.параметры span{background:var(--фон);border-radius:10px;padding:8px 5px;text-align:center;font-size:11px;color:var(--втор);line-height:1.2}.параметры span b{color:var(--текст);font-size:12px}.описание{font-size:13px;color:var(--втор);line-height:1.5;margin:10px 0 0}.время{font-weight:900;color:var(--акцент);font-size:12px;letter-spacing:.3px;text-transform:uppercase}.форма{display:grid;gap:10px}.поле label{display:block;color:var(--втор);font-size:12px;margin:0 0 5px 3px}.поле input,.поле select,.поле textarea{width:100%;padding:13px;border-radius:13px;border:1px solid var(--линия);background:var(--фон);color:var(--текст)}canvas{display:block;width:100%;height:180px}.запись{display:flex;gap:8px}.запись input{min-width:0;flex:1}.уведомление{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-120px);z-index:99;background:#151a21;color:white;padding:13px 18px;border-radius:15px;box-shadow:0 10px 30px #0005;transition:.35s;max-width:90%;text-align:center;font-weight:800}.уведомление.показать{transform:translate(-50%,0)}.занавес{position:fixed;inset:0;z-index:80;background:var(--фон);display:none;overflow:auto}.занавес.открыт{display:block}.трен-шапка{padding:calc(14px + env(safe-area-inset-top)) 18px 12px;display:flex;justify-content:space-between;align-items:center}.схема{height:120px;border-radius:20px;background:linear-gradient(135deg,#202633,#11151b);display:grid;place-items:center;color:#fff;font-size:52px;margin:8px 0 16px}.подход-круг{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;margin:14px auto;background:conic-gradient(var(--акцент) var(--доля),var(--линия) 0);position:relative}.подход-круг:after{content:"";position:absolute;inset:9px;background:var(--карта);border-radius:50%}.подход-круг strong{z-index:1;font-size:22px}.таймер{font-size:54px;font-variant-numeric:tabular-nums;font-weight:950;text-align:center;letter-spacing:-2px;margin:15px 0}.мини{font-size:12px;color:var(--втор)}.кнопки{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.кнопки button{padding:13px 6px}.переключатель{width:48px;height:28px;border-radius:20px;border:0;background:var(--линия);padding:3px;cursor:pointer}.переключатель i{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.переключатель.да{background:var(--зел)}.переключатель.да i{transform:translateX(20px)}.значок-достиж{filter:grayscale(1);opacity:.35}.значок-достиж.есть{filter:none;opacity:1}.таблица{width:100%;border-collapse:collapse;font-size:12px}.таблица th,.таблица td{padding:10px 6px;border-bottom:1px solid var(--линия);text-align:left}.таблица th{color:var(--втор);font-weight:700}.плашка{font-size:11px;padding:5px 9px;border-radius:20px;background:var(--фон);color:var(--втор);font-weight:750;display:inline-block}.диалог{position:fixed;inset:0;background:#0008;z-index:90;display:none;place-items:end center;padding:14px}.диалог.открыт{display:grid}.окно{width:min(690px,100%);max-height:88vh;overflow:auto;background:var(--карта);border-radius:25px;padding:20px;animation:снизу .25s ease}@keyframes снизу{from{transform:translateY(40px);opacity:0}}.блок-инфо{border-left:4px solid var(--акцент);padding:13px 15px;background:color-mix(in srgb,var(--акцент) 6%,var(--карта));border-radius:0 14px 14px 0;margin:12px 0;font-size:13px;line-height:1.55}.блок-инфо b{color:var(--текст)}.шаг-разминки{display:flex;gap:12px;margin:10px 0;padding:11px;background:var(--фон);border-radius:14px;align-items:flex-start}.шаг-номер{width:28px;height:28px;border-radius:50%;background:var(--акцент);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px;flex:0 0 28px}.карточка-клик{cursor:pointer;transition:transform .12s ease}.карточка-клик:active{transform:scale(.985)}@media(min-width:650px){.сетка.шире{grid-template-columns:repeat(4,1fr)}.диалог{place-items:center}.окно{max-height:80vh}.экран{padding-left:22px;padding-right:22px}}

function загрузить() {
  try {
    let s = localStorage.getItem(КЛЮЧ);
    if (!s) return structuredClone(начальные);
    let obj = Object.assign({}, начальные, JSON.parse(s));
    if (!obj.базоваяДата) obj.базоваяДата = сегодняСтрока;
    return obj;
  } catch (e) {
    return structuredClone(начальные);
  }
}

function датаКлюч(d = new Date()) {
  return d.toISOString().slice(0, 10);
}

function увед(t) {
  let e = document.getElementById('уведомление');
  e.textContent = t;
  e.classList.add('показать');
  setTimeout(() => e.classList.remove('показать'), 2800);
}

function индексДня(d = new Date()) {
  let target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  let bParts = данные.базоваяДата.split('-');
  let base = new Date(+bParts[0], +bParts[1] - 1, +bParts[2]);
  let diff = Math.round((target.getTime() - base.getTime()) / 86400000);
  return ((diff % 7) + 7) % 7;
}

function деньПоДате(d = new Date()) {
  return программа[индексДня(d)];
}

function сегодняПрограмма() {
  return программа[индексДня(new Date())];
}

function номерНедели() {
  let bParts = данные.базоваяДата.split('-');
  let base = new Date(+bParts[0], +bParts[1] - 1, +bParts[2]);
  let diff = Math.floor((new Date().getTime() - base.getTime()) / 86400000);
  return (Math.abs(diff) % 8) + 1;
}

function серия() {
  let s = 0, d = new Date();
  for (let i = 0; i < 365; i++) {
    let k = датаКлюч(d);
    if (данные.завершено[k]) s++;
    else if (i > 0) break;
    d.setDate(d.getDate() - 1);
  }
  return s;
}

function выполнитьПроцент() {
  let cur = датаКлюч().slice(0, 7);
  let n = Object.keys(данные.завершено).filter(k => k.slice(0, 7) === cur).length;
  return Math.min(100, Math.round(n / 30 * 100));
}

function календарь() {
  let y = датаКалендаря.getFullYear(), m = датаКалендаря.getMonth();
  let перв = new Date(y, m, 1);
  let см = (перв.getDay() + 6) % 7;
  let дней = new Date(y, m + 1, 0).getDate();
  let яч = '';

  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(x => { яч += `<div class="день-нед">${x}</div>`; });
  for (let i = 0; i < см; i++) яч += '<div></div>';

  for (let d = 1; d <= дней; d++) {
    let dt = new Date(y, m, d);
    let k = датаКлюч(dt);
    let кл = 'дата план';
    if (данные.завершено[k]) кл += ' готово';
    else if (dt.getTime() < new Date().setHours(0, 0, 0, 0)) кл += ' пропуск';
    if (k === датаКлюч()) кл += ' сегодня';
    яч += `<button class="${кл}" onclick="выбратьДату(${y},${m},${d})">${d}<i class="точка"></i></button>`;
  }

  return `
  <h1>Календарь подготовки</h1>
  <div class="подзаг">Синхронное расписание бега и основной работы на каждый день</div>

      <button class="иконка-кнопка" onclick="месяцСдвиг(1)">›</button>
    </div>
    <div class="месяц-сетка">${яч}</div>
  </div>

    <span class="плашка">● Выполнено</span>

  `;
}

    ['⚡', 'Серия недели', '7 дней подряд без пропусков', серия() >= 7],
    ['👑', 'Силовой рекорд', 'Обновлён персональный рекорд', Object.keys(данные.рекорды).length > 5],
    ['🦅', 'Мастер турника', 'Подтягивания 25+ раз', parseInt(данные.рекорды['Подтягивания'] || '0') >= 25],
    ['🏃', 'Беговая база', '15+ завершённых пробежек', данные.история.filter(x => x.тип === 'бег').length >= 15],

  return `

}

function ползунок(id, назв, val) {
  return `
  <div class="поле">

  </div>
  `;
}

function отрисовать() {
  document.documentElement.dataset.theme = данные.тема;
  document.getElementById('главная').innerHTML = главная();
  document.getElementById('календарь').innerHTML = календарь();
  document.getElementById('тренировки').innerHTML = тренировки();
  document.getElementById('прогресс').innerHTML = прогресс();
  document.getElementById('профиль').innerHTML = профиль();
  if (страница === 'прогресс') setTimeout(графики, 30);
}

function перейти(p) {
  страница = p;
  document.querySelectorAll('.экран').forEach(e => e.classList.toggle('активен', e.id === p));
  document.querySelectorAll('.нав').forEach(e => e.classList.toggle('активен', e.dataset.page === p));
  if (p === 'прогресс') setTimeout(графики, 30);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.нав').forEach(b => {
  b.onclick = () => {
    let p = b.getAttribute('data-page');
    if (p) перейти(p);
  };
});

function месяцСдвиг(n) {
  датаКалендаря.setMonth(датаКалендаря.getMonth() + n);
  document.getElementById('календарь').innerHTML = календарь();
}

function выбратьДату(y, m, d) {
  document.getElementById('деньКалендаря').innerHTML = картаДня(new Date(y, m, d));

      <b>Зачем тренировать атлету:</b><br>${m.зачем}<br><br>
      <b>Основные базовые упражнения:</b><br>${m.база}<br><br>
      <b>Вспомогательные и изоляция:</b><br>${m.подсобка}
    </p>
    <div class="блок-инфо" style="border-left-color:var(--зел)">
      <b>Стратегия прогрессии:</b><br>${m.прогрессия}
    </div>
    <div class="блок-инфо" style="border-left-color:#d83d3d">
      <b style="color:#d83d3d">Типичные ошибки:</b><br>${m.ошибки}
    </div>
  `);
}

function начатьСегодня() {
  начать(индексДня());
}

function начать(деньИндекс) {
  сеанс = {
    день: деньИндекс,
    индексУпр: 0,
    подход: 1,
    начало: Date.now(),
    выполнено: [],
    пропущено: 0,
    тоннаж: 0
  };
  показатьУпрЭкран();
}

function показатьУпрЭкран() {
  let p = программа[сеанс.день];
  let u = p.упр[сеанс.индексУпр];
  let всегоПодходов = u.подходы;
  let доля = Math.min(100, Math.round(сеанс.подход / всегоПодходов * 100));

  let html = `
  <div class="трен-шапка">
    <button class="иконка-кнопка" onclick="выйтиИзТрен()">×</button>
    <b>Упражнение ${сеанс.индексУпр + 1} из ${p.упр.length}</b>
    <span class="мини">${Math.round((Date.now() - сеанс.начало) / 60000)} мин</span>
  </div>
  <div style="padding:0 18px 30px;max-width:680px;margin:auto">
    <div class="схема">${сеанс.день % 2 === 0 ? '🏋️' : '⚡'}</div>
    <span class="время">${u.категория}</span>
    <h1 style="margin:6px 0 2px">${u.название}</h1>
    <div class="мини" style="margin-bottom:10px">Мышцы: ${u.мышцы}</div>

    <div class="подход-круг" style="--доля:${доля}%">
      <strong>${сеанс.подход}/${всегоПодходов}</strong>
    </div>

    <div class="сетка">
      <div class="показатель"><strong>${u.повторы}</strong><span>целевые повторы</span></div>
      <div class="показатель"><strong>${u.вес}</strong><span>плановый вес</span></div>
      <div class="показатель"><strong>${u.запас}</strong><span>запас (RIR)</span></div>
      <div class="показатель"><strong>${u.отдых}</strong><span>отдых</span></div>
    </div>

    <div class="карта форма" style="margin:12px 0">
      <div class="сетка">
        <div class="поле"><label>Фактический вес (кг)</label><input id="фактВес" type="text" value="${u.вес.replace(/[^\d.,]/g,'') || '75'}"></div>
        <div class="поле"><label>Фактические повторы</label><input id="фактПовторы" type="number" value="${parseInt(u.повторы) || 5}"></div>
      </div>
    </div>

    <p class="описание" style="margin-bottom:14px"><b>Технический фокус:</b> ${u.исходное.slice(0, 110)}...</p>

    <button class="главная-кнопка" onclick="подходЗавершён()">ПОДХОД ВЫПОЛНЕН</button>

    <div class="кнопки" style="margin-top:9px">
      <button class="втор-кнопка" onclick="открытьКарточкуУпр(${сеанс.день}, ${сеанс.индексУпр})">Справка по технике</button>
      <button class="втор-кнопка" onclick="добавитьПодход()">+ Подход</button>
      <button class="втор-кнопка" onclick="пропуститьПодход()">Пропустить подход</button>
      <button class="втор-кнопка" onclick="следУпр()">Следующее упр. ›</button>
    </div>
  </div>
  `;
  let r = document.getElementById('режим');
  r.innerHTML = html;
  r.classList.add('открыт');
}

function подходЗавершён() {
  let u = программа[сеанс.день].упр[сеанс.индексУпр];
  let весВвод = parseFloat(document.getElementById('фактВес')?.value) || 0;
  let повтВвод = parseInt(document.getElementById('фактПовторы')?.value) || 5;

  сеанс.выполнено.push({
    упражнение: u.название,
    подход: сеанс.подход,
    повторы: повтВвод,
    вес: весВвод
  });
  сеанс.тоннаж += (весВвод * повтВвод);

  if (сеанс.подход >= u.подходы) {
    if (сеанс.индексУпр >= программа[сеанс.день].упр.length - 1) {
      экранЗавершения();
    } else {
      сеанс.индексУпр++;
      сеанс.подход = 1;
      запуститьОтдых(числоОтдыха(u.отдых));
    }
  } else {
    сеанс.подход++;
    запуститьОтдых(числоОтдыха(u.отдых));
  }
}

function числоОтдыха(s) {
  if (typeof s !== 'string') return данные.отдых;
  if (s.includes('мин')) return parseFloat(s.replace(',', '.')) * 60;
  if (s.includes('с')) return parseInt(s);
  return данные.отдых;
}

function запуститьОтдых(sec) {
  осталось = Math.round(sec);
  пауза = false;
  let p = программа[сеанс.день];
  let u = p.упр[сеанс.индексУпр];

  document.getElementById('режим').innerHTML = `
    <div class="трен-шапка">
      <button class="иконка-кнопка" onclick="пропуститьТаймер()">×</button>
      <b>Восстановление</b>
      <span></span>
    </div>
    <div style="padding:40px 18px;max-width:600px;margin:auto;text-align:center">
      <div class="круг" style="width:96px;height:96px;margin:auto;font-size:36px">◷</div>
      <div id="цифрыОтдыха" class="таймер">${формат(осталось)}</div>
      <p class="подзаг">Следующий: Подход ${сеанс.подход} • <b>${u.название}</b></p>
      <div class="кнопки">
        <button id="паузаКн" class="втор-кнопка" onclick="паузаТаймера()">Пауза</button>
        <button class="втор-кнопка" onclick="пропуститьТаймер()">Пропустить отдых</button>
        <button class="втор-кнопка" onclick="изменитьВремя(15)">+15 секунд</button>
        <button class="втор-кнопка" onclick="изменитьВремя(-15)">−15 секунд</button>
      </div>
    </div>
  `;

  clearInterval(таймер);
  таймер = setInterval(() => {
    if (!пауза) {
      осталось--;
      let el = document.getElementById('цифрыОтдыха');
      if (el) el.textContent = формат(Math.max(0, осталось));
      if (осталось <= 0) {
        clearInterval(таймер);
        сигнал();
        показатьУпрЭкран();
      }
    }
  }, 1000);
}

function формат(s) {
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function паузаТаймера() {
  пауза = !пауза;
  let b = document.getElementById('паузаКн');
  if (b) b.textContent = пауза ? 'Продолжить' : 'Пауза';
}

function изменитьВремя(n) {
  осталось = Math.max(0, осталось + n);
  let el = document.getElementById('цифрыОтдыха');
  if (el) el.textContent = формат(осталось);
}

function пропуститьТаймер() {
  clearInterval(таймер);
  показатьУпрЭкран();
}

function сигнал() {
  try {
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
  if (navigator.vibrate) {
    try { navigator.vibrate([160, 70, 160]); } catch (e) {}
  }
}

function пропуститьПодход() {
  сеанс.пропущено++;
  let u = программа[сеанс.день].упр[сеанс.индексУпр];
  if (сеанс.подход >= u.подходы) следУпр();
  else {
    сеанс.подход++;
    показатьУпрЭкран();
  }
}

function добавитьПодход() {
  увед('Дополнительный подход добавлен к упражнению');
  сеанс.подход = Math.max(1, сеанс.подход - 1);
  показатьУпрЭкран();
}

function следУпр() {
  if (сеанс.индексУпр >= программа[сеанс.день].упр.length - 1) {
    экранЗавершения();
  } else {
    сеанс.индексУпр++;
    сеанс.подход = 1;
    показатьУпрЭкран();
  }
}

function выйтиИзТрен() {
  if (confirm('Прервать тренировочный сеанс? Несохраненные подходы будут потеряны.')) {
    clearInterval(таймер);
    document.getElementById('режим').classList.remove('открыт');
  }
}

function экранЗавершения() {
  clearInterval(таймер);
  сигнал();
  let дл = Math.max(1, Math.round((Date.now() - сеанс.начало) / 60000));
  let p = программа[сеанс.день];
  let всегоСетовПлан = p.упр.reduce((acc, item) => acc + item.подходы, 0);
  let выполненоСетов = сеанс.выполнено.length;
  let процент = Math.round(выполненоСетов / всегоСетовПлан * 100);

  let анализ = процент >= 100
    ? '✅ Сегодня выполнено 100% запланированной тренировки. Все подходы закрыты чисто!'
    : `⚠️ Пропущено ${всегоСетовПлан - выполненоСетов} подходов. Они не учитываются как выполненный объём.`;

  document.getElementById('режим').innerHTML = `
    <div style="padding:40px 20px;text-align:center;max-width:600px;margin:auto">
      <div style="font-size:74px">🏆</div>
      <h1 style="margin:10px 0 4px">Тренировка завершена!</h1>
      <p class="подзаг">${p.название} • ${дл} минут</p>

      <div class="карта" style="text-align:left;margin:18px 0">
        <div class="ряд между"><b>Статус выполнения</b><span class="плашка">${процент}%</span></div>
        <p class="описание">${анализ}</p>
        <div class="сетка" style="margin-top:10px">
          <div class="показатель"><strong>${выполненоСетов}/${всегоСетовПлан}</strong><span>подходов</span></div>
          <div class="показатель"><strong>${сеанс.тоннаж > 0 ? сеанс.тоннаж + ' кг' : 'Собств. вес'}</strong><span>общий объём</span></div>
        </div>
      </div>

      <div class="карта форма" style="text-align:left;margin:18px 0">
        <div class="поле">
          <label>Субъективная тяжесть (RPE от 1 до 10): <b id="итогRPEЗн">8</b></label>
          <input id="итогRPE" type="range" min="1" max="10" value="8" oninput="document.getElementById('итогRPEЗн').textContent=this.value">
        </div>
        <div class="поле">
          <label>Заметки атлета по тренировке</label>
          <textarea id="итогЗаметки" rows="3" placeholder="Как самочувствие, скорость снаряда, состояние суставов?"></textarea>
        </div>
      </div>

      <button class="главная-кнопка" onclick="финалСохранить(${дл})">СОХРАНИТЬ В ДНЕВНИК</button>
    </div>
  `;
}

  let k = датаКлюч();

    тоннаж: сеанс.тоннаж

function графики() {
  нарисовать('графикВеса', данные.вес.map(x => x.значение), '#ff5a36');
  let arr = [];
  for (let w = 7; w >= 0; w--) {
    let c = 0;
    данные.история.forEach(x => {
      let r = (Date.now() - new Date(x.дата).getTime()) / 86400000;
      if (r >= w * 7 && r < (w + 1) * 7) c++;
    });
    arr.push(c);
  }
  нарисовать('графикТрен', arr, '#3978f6');
}

function нарисовать(id, vals, color) {
  let c = document.getElementById(id);
  if (!c) return;
  let x = c.getContext('2d'), w = c.width, h = c.height;
  x.clearRect(0, 0, w, h);

  x.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--линия');
  x.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    x.beginPath();
    x.moveTo(35, i * h / 5);
    x.lineTo(w - 10, i * h / 5);
    x.stroke();
  }

  if (!vals.length) return;
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max === min) { max += 1; min -= 1; }

  x.strokeStyle = color;
  x.lineWidth = 4;
  x.lineCap = 'round';
  x.lineJoin = 'round';
  x.beginPath();

  vals.forEach((v, i) => {
    let px = 35 + i * (w - 50) / Math.max(1, vals.length - 1);
    let py = h - 25 - (v - min) / (max - min) * (h - 55);
    if (i) x.lineTo(px, py); else x.moveTo(px, py);
  });
  x.stroke();

  vals.forEach((v, i) => {
    let px = 35 + i * (w - 50) / Math.max(1, vals.length - 1);
    let py = h - 25 - (v - min) / (max - min) * (h - 55);
    x.fillStyle = color;
    x.beginPath();
    x.arc(px, py, 6, 0, Math.PI * 2);
    x.fill();
    x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--текст');
    x.font = '11px system-ui';
    x.fillText(String(v), px - 6, py - 10);
  });
}

function добавитьВес() {
  let v = parseFloat(document.getElementById('новыйВес').value);
  if (!v || v < 35 || v > 200) return увед('Введите корректный вес тела');
  данные.вес.push({ дата: датаКлюч(), значение: v });
  сохранить();
  отрисовать();
  увед('Вес тела обновлён!');
}

function изменитьРекорд(k) {
  let v = prompt('Введите новый рекорд для: ' + k, данные.рекорды[k]);
  if (v) {
    данные.рекорды[k] = v;
    сохранить();
    отрисовать();
    увед('🏆 Рекорд сохранён!');
  }
}

function новыйРекорд() {
  let k = prompt('Название дисциплины:');
  if (!k) return;
  let v = prompt('Результат:');
  if (v) {
    данные.рекорды[k] = v;
    сохранить();
    отрисовать();
    увед('🏆 Новая дисциплина добавлена!');
  }
}

function сохранитьПитание() {
  данные.питание = {
    масса: данные.вес.at(-1)?.значение || 67,
    цель: +document.getElementById('пЦель').value,
    калории: +document.getElementById('пКал').value,
    белки: +document.getElementById('пБел').value,
    жиры: +document.getElementById('пЖир').value,
    углеводы: +document.getElementById('пУгл').value,
    вода: +document.getElementById('пВода').value
  };
  сохранить();
  увед('Параметры питания сохранены!');
}

function сохранитьВосстановление() {
  данные.восстановление.push({
    дата: датаКлюч(),
    сон: +document.getElementById('сон').value,
    качество: +document.getElementById('качество').value,
    энергия: +document.getElementById('энергия').value,
    усталость: +document.getElementById('усталость').value
  });
  сохранить();
  увед('Отметка восстановления сохранена!');
}

function тема() {
  данные.тема = данные.тема === 'dark' ? 'light' : 'dark';
  сохранить();
  отрисовать();
}
document.getElementById('быстраяТема').onclick = тема;

async function уведомления() {
  if (!('Notification' in window)) {
    увед('Браузер не поддерживает системные уведомления');
    return;
  }
  if (!данные.уведомления) {
    let r = await Notification.requestPermission();
    данные.уведомления = (r === 'granted');
    if (данные.уведомления) {
      new Notification('Атлет 7', { body: 'Напоминания о тренировках и беге включены!' });
    }
  } else {
    данные.уведомления = false;
  }
  сохранить();
  отрисовать();
}

function экспорт() {
  let b = new Blob([JSON.stringify(данные, null, 2)], { type: 'application/json' });
  let a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = `атлет-7-дневник-${датаКлюч()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  увед('Резервная копия скачана!');
}

document.getElementById('импортФайл').onchange = e => {
  let f = e.target.files[0];
  if (!f) return;
  let r = new FileReader();
  r.onload = () => {
    try {
      данные = Object.assign({}, начальные, JSON.parse(r.result));
      сохранить();
      отрисовать();
      увед('Данные успешно восстановлены!');
    } catch (x) {
      увед('Ошибка чтения файла');
    }
  };
  r.readAsText(f);
};

function сброс() {
  if (confirm('Сбросить все тренировочные данные, историю и рекорды?')) {
    localStorage.removeItem(КЛЮЧ);
    данные = structuredClone(начальные);
    данные.базоваяДата = сегодняСтрока;
    сохранить();
    отрисовать();
    увед('Прогресс сброшен к первому дню (Зал)');
  }
}

// Регистрация всех глобальных обработчиков в объекте window для чистоты линтера
Object.assign(window, {
  индексДня,
  месяцСдвиг,
  выбратьДату,
  сменитьРаздел,
  закрытьДиалог,
  открытьДеньПоИндексу,
  открытьБегИнфо,
  открытьКарточкуУпр,
  открытьМышцу,
  начатьСегодня,
  начать,
  подходЗавершён,
  паузаТаймера,
  изменитьВремя,
  пропуститьТаймер,
  пропуститьПодход,
  добавитьПодход,
  следУпр,
  выйтиИзТрен,
  финалСохранить,
  интервальныйТаймер,
  паузаБег,
  сменитьФазуБег,
  бегВремя,
  завершитьБег,
  выйтиБег,
  историяДетали,
  добавитьВес,
  изменитьРекорд,
  новыйРекорд,
  сохранитьПитание,
  сохранитьВосстановление,
  тема,
  уведомления,
  экспорт,
  сброс,
  перейти
});

отрисовать();
</script>
</body>
</html>
