function датаКлюч(d=new Date()){return d.toISOString().slice(0,10)}

function значок(место){return место.startsWith('Зал')?'🏋️':место.startsWith('Стадион')?'⚡':'◆'}
function сегодняПрограмма(){return программа[new Date().getDay()]}
function наборДаты(d){return программа[d.getDay()]}
function минутыТекста(n){return n+' мин'}
function выполнитьПроцент(){let n=Object.keys(данные.завершено).filter(k=>k.slice(0,7)===датаКлюч().slice(0,7)).length;return Math.min(100,Math.round(n/30*100))}
function серия(){let s=0,d=new Date();for(let i=0;i<365;i++){let k=датаКлюч(d);if(данные.завершено[k])s++;else if(i>0)break;d.setDate(d.getDate()-1)}return s}
function ближайшая(){let h=new Date().getHours();return h<9?`${данные.утро} — утренний бег`:h<20?`${данные.вечер} — вечерняя тренировка`:'Завтра '+данные.утро+' — утренний бег'}
function главная(){let п=сегодняПрограмма(),сделано=!!данные.завершено[датаКлюч()];return `<h1>${дни[new Date().getDay()]}</h1><div class="подзаг">${new Date().getDate()} ${мес[new Date().getMonth()]} • неделя цикла ${номерНедели()}</div>
<div class="карта герой"><span class="метка">СЕГОДНЯ • ${п.место.toUpperCase()}</span><h2>${п.название}</h2><p>${п.бег.название} утром • ${п.упр.length} упражнений вечером</p><div class="ряд между"><b>≈ ${п.длительность+45} мин за день</b><span>${сделано?'✓ Выполнено':'Запланировано'}</span></div><br><button class="главная-кнопка" onclick="начатьВыбор()">${сделано?'ОТКРЫТЬ ТРЕНИРОВКУ':'НАЧАТЬ ТРЕНИРОВКУ'}</button></div>
<div class="сетка шире"><div class="показатель"><strong>${серия()}</strong><span>дней подряд</span></div><div class="показатель"><strong>${данные.история.length}</strong><span>тренировок</span></div><div class="показатель"><strong>${выполнитьПроцент()}%</strong><span>месяц</span></div><div class="показатель"><strong>${номерНедели()}/8</strong><span>цикл</span></div></div>
<h2>План дня</h2><div class="список-карта" onclick="открытьДень(new Date(),true)"><div class="круг">🏃</div><div><b>${п.бег.название}</b><small>${п.бег.время} • ${п.бег.дистанция}</small></div><span class="стрелка">›</span></div><div class="список-карта" onclick="открытьДень(new Date(),false)"><div class="круг">${значок(п.место)}</div><div><b>${п.название}</b><small>${данные.вечер} • ${п.место} • ${п.длительность} мин</small></div><span class="стрелка">›</span></div>

function номерНедели(){let старт=new Date(new Date().getFullYear(),0,1),разн=Math.floor((new Date()-старт)/86400000);return разн%8+1}
function календарь(){let y=датаКалендаря.getFullYear(),m=датаКалендаря.getMonth(),перв=new Date(y,m,1),см=(перв.getDay()+6)%7,дней=new Date(y,m+1,0).getDate(),яч='';['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(x=>яч+=`<div class="день-нед">${x}</div>`);for(let i=0;i<см;i++)яч+='<div></div>';for(let d=1;d<=дней;d++){let dt=new Date(y,m,d),k=датаКлюч(dt),кл='дата план';if(данные.завершено[k])кл+=' готово';else if(dt<new Date().setHours(0,0,0,0))кл+=' пропуск';if(k===датаКлюч())кл+=' сегодня';яч+=`<button class="${кл}" onclick="выбратьДату(${y},${m},${d})">${d}<i class="точка"></i></button>`}return `<h1>Календарь</h1><div class="подзаг">Утренний бег и основная работа каждый день</div><div class="карта"><div class="календарь-шапка"><button class="иконка-кнопка" onclick="месяцСдвиг(-1)">‹</button><h3>${мес[m].replace('я','ь').replace('а','')} ${y}</h3><button class="иконка-кнопка" onclick="месяцСдвиг(1)">›</button></div><div class="месяц-сетка">${яч}</div></div><div class="ряд"><span class="плашка">● выполнено</span><span class="плашка">○ пропущено</span><span class="плашка">• запланировано</span></div><div id="деньКалендаря">${картаДня(new Date())}</div>`}
function картаДня(d){let п=наборДаты(d);return `<h2>${d.getDate()} ${мес[d.getMonth()]} • ${дни[d.getDay()]}</h2><div class="список-карта" onclick="открытьДень(new Date('${датаКлюч(d)}T12:00:00'),true)"><div class="круг">🏃</div><div><b>${п.бег.название}</b><small>${п.бег.дистанция} • ${п.бег.интенсивность}</small></div><span class="стрелка">›</span></div><div class="список-карта" onclick="открытьДень(new Date('${датаКлюч(d)}T12:00:00'),false)"><div class="круг">${значок(п.место)}</div><div><b>${п.название}</b><small>${п.место} • ${п.длительность} мин</small></div><span class="стрелка">›</span></div>`}
function тренировки(){let вкладки=['неделя','бег','стадион','турники','зал','цикл','история'];return `<h1>Тренировки</h1><div class="вкладки">${вкладки.map(x=>`<button class="вкладка ${подраздел===x?'активна':''}" onclick="сменитьРаздел('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div id="содержТрен">${содержаниеРаздела()}</div>`}
function содержаниеРаздела(){if(подраздел==='неделя')return Object.keys(программа).sort((a,b)=>(+a||7)-(+b||7)).map(k=>карточкаПрограммы(+k)).join('');if(подраздел==='цикл')return `<div class="карта"><h3>Восьминедельный цикл</h3>${цикл.map(x=>`<div class="раздел-упр"><b>Неделя ${x[0]} • ${x[1]}</b><p class="описание">${x[2]}</p></div>`).join('')}</div><div class="карта"><h3>Правило выбора веса</h3><p class="описание">Интенсивность 7 = три повтора в запасе; 8 = два; 9 = один; 10 в программе запрещена. Если все подходы выполнены с заданным запасом и одинаковой техникой — на следующей неделе добавить 2,5 кг в жимах и подтягиваниях, 5 кг в приседе и тяге. Если запас меньше цели — снизить вес на 3–5% в этом же занятии.</p></div>`;if(подраздел==='история')return историяРазметка();let фильтр={бег:()=>true,стадион:p=>p.место.includes('Стадион'),турники:p=>p.место.includes('турники'),зал:p=>p.место==='Зал'}[подраздел];return Object.keys(программа).filter(k=>фильтр(программа[k])).sort((a,b)=>(+a||7)-(+b||7)).map(k=>подраздел==='бег'?картаБега(+k):карточкаПрограммы(+k)).join('')}
function карточкаПрограммы(k){let p=программа[k];return `<div class="карта" onclick="открытьДеньПоНомеру(${k},false)"><div class="ряд между"><span class="время">${дни[k]}</span><span class="плашка">${p.длительность} мин</span></div><h3 style="margin-top:8px">${p.название}</h3><p class="описание">${p.место} • ${p.упр.length} упражнений<br>Утро: ${p.бег.название}, ${p.бег.дистанция}</p></div>`}
function картаБега(k){let p=программа[k];return `<div class="карта" onclick="открытьДеньПоНомеру(${k},true)"><span class="время">${дни[k]} • ${p.бег.время}</span><h3 style="margin-top:8px">${p.бег.название}</h3><p class="описание"><b>${p.бег.дистанция}</b><br>${p.бег.интенсивность}<br>${p.бег.цель}</p><button class="втор-кнопка" onclick="event.stopPropagation();интервальныйТаймер(${k})">Таймер бега</button></div>`}
function прогресс(){return `<h1>Прогресс</h1><div class="подзаг">Нагрузка, масса тела и рекорды</div><div class="карта"><div class="ряд между"><h3>Масса тела</h3><b>${данные.вес.at(-1)?.значение||67} кг</b></div><canvas id="графикВеса" width="640" height="260"></canvas><div class="запись"><input id="новыйВес" type="number" step="0.1" placeholder="Масса, кг"><button class="главная-кнопка" style="width:auto" onclick="добавитьВес()">Сохранить</button></div></div><div class="карта"><h3>Тренировки за 8 недель</h3><canvas id="графикТрен" width="640" height="260"></canvas></div><h2>Мои рекорды</h2><div class="карта">${Object.entries(данные.рекорды).map(([k,v])=>`<div class="раздел-упр ряд между"><b>${k}</b><span onclick="изменитьРекорд('${k.replaceAll("'","\\'")}')">${v} ✎</span></div>`).join('')}<button class="втор-кнопка" onclick="новыйРекорд()">Добавить рекорд</button></div><h2>Достижения</h2>${достижения()}`}
function достижения(){let н=данные.история.length,д=[['🏁','Первая тренировка',н>=1],['🔥','7 тренировок',н>=7],['🏆','30 тренировок',н>=30],['⚡','Серия 7 дней',серия()>=7],['👑','Новый рекорд',Object.keys(данные.рекорды).length>8],['🦅','30 подтягиваний',parseInt(данные.рекорды['Подтягивания'])>=30],['🏃','100 км бега',данные.история.filter(x=>x.тип==='бег').length>=15],['◆','Полная неделя',серия()>=7]];return `<div class="сетка">${д.map(x=>`<div class="показатель значок-достиж ${x[2]?'есть':''}"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div>`}
function профиль(){let p=данные.питание,посл=данные.восстановление.at(-1);return `<h1>Профиль</h1><div class="карта"><div class="ряд"><div class="круг">🏃</div><div><h3>Атлет • 16 лет</h3><div class="мини">184 см • ${данные.вес.at(-1)?.значение||67} кг • цикл ${номерНедели()}/8</div></div></div></div><h2>Питание</h2><div class="карта форма"><div class="сетка"><div class="поле"><label>Цель массы, кг</label><input id="пЦель" type="number" value="${p.цель}"></div><div class="поле"><label>Калорийность</label><input id="пКал" type="number" value="${p.калории}"></div><div class="поле"><label>Белки, г</label><input id="пБел" type="number" value="${p.белки}"></div><div class="поле"><label>Жиры, г</label><input id="пЖир" type="number" value="${p.жиры}"></div><div class="поле"><label>Углеводы, г</label><input id="пУгл" type="number" value="${p.углеводы}"></div><div class="поле"><label>Вода, л</label><input id="пВода" type="number" step=".1" value="${p.вода}"></div></div><button class="втор-кнопка" onclick="сохранитьПитание()">Сохранить питание</button></div><h2>Восстановление</h2><div class="карта форма"><div class="поле"><label>Сон, часы</label><input id="сон" type="number" step=".1" value="${посл?.сон||8.5}"></div>${ползунок('качество','Качество сна',посл?.качество||4)}${ползунок('энергия','Энергия',посл?.энергия||4)}${ползунок('усталость','Усталость',посл?.усталость||2)}<button class="втор-кнопка" onclick="сохранитьВосстановление()">Сохранить отметку</button></div><h2>Настройки</h2><div class="карта форма"><div class="ряд между"><b>Тёмная тема</b><button class="переключатель ${данные.тема==='dark'?'да':''}" onclick="тема()"><i></i></button></div><div class="ряд между"><b>Уведомления</b><button class="переключатель ${данные.уведомления?'да':''}" onclick="уведомления()"><i></i></button></div><div class="поле"><label>Единицы измерения</label><select id="единицы" onchange="данные.единицы=this.value;сохранить()"><option ${данные.единицы==='кг и км'?'selected':''}>кг и км</option><option ${данные.единицы==='фунты и мили'?'selected':''}>фунты и мили</option></select></div><div class="сетка"><div class="поле"><label>Утренний бег</label><input id="времяУтро" type="time" value="${данные.утро}" onchange="данные.утро=this.value;сохранить()"></div><div class="поле"><label>Вечерняя работа</label><input id="времяВечер" type="time" value="${данные.вечер}" onchange="данные.вечер=this.value;сохранить()"></div></div><div class="поле"><label>Отдых по умолчанию, с</label><input type="number" value="${данные.отдых}" onchange="данные.отдых=+this.value;сохранить()"></div><div class="кнопки"><button class="втор-кнопка" onclick="экспорт()">Экспорт данных</button><button class="втор-кнопка" onclick="document.getElementById('импортФайл').click()">Импорт данных</button></div><button class="втор-кнопка опасная" onclick="сброс()">Сбросить весь прогресс</button></div><div class="карта"><h3>Критерий допуска к полной нагрузке</h3><p class="описание">Если сон менее 7 часов или энергия ≤2 из 5 одновременно с усталостью ≥4 из 5: убрать кондиционный блок, силовые рабочие подходы сократить на 25%, скорость оставить только при разбросе времени не более 3%. Это измеримое управление нагрузкой, а не произвольное облегчение.</p></div>`}
function ползунок(id,назв,val){return `<div class="поле"><label>${назв}: <b id="${id}Зн">${val}</b> из 5</label><input id="${id}" type="range" min="1" max="5" value="${val}" oninput="document.getElementById('${id}Зн').textContent=this.value"></div>`}
function отрисовать(){document.documentElement.dataset.theme=данные.тема;document.getElementById('главная').innerHTML=главная();document.getElementById('календарь').innerHTML=календарь();document.getElementById('тренировки').innerHTML=тренировки();document.getElementById('прогресс').innerHTML=прогресс();document.getElementById('профиль').innerHTML=профиль();if(страница==='прогресс')setTimeout(графики,20)}
function перейти(p){страница=p;document.querySelectorAll('.экран').forEach(e=>e.classList.toggle('активен',e.id===p));document.querySelectorAll('.нав').forEach(e=>e.classList.toggle('активен',e.dataset.page===p));if(p==='прогресс')setTimeout(графики,20);scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.нав').forEach(b=>b.onclick=()=>перейти(b.dataset.page));
function месяцСдвиг(n){датаКалендаря.setMonth(датаКалендаря.getMonth()+n);document.getElementById('календарь').innerHTML=календарь()}
function выбратьДату(y,m,d){document.getElementById('деньКалендаря').innerHTML=картаДня(new Date(y,m,d))}
function сменитьРаздел(x){подраздел=x;document.getElementById('тренировки').innerHTML=тренировки()}
function открытьДеньПоНомеру(k,бег){let d=new Date();while(d.getDay()!==k)d.setDate(d.getDate()+1);открытьДень(d,бег)}
function открытьДень(d,толькоБег){let p=наборДаты(d),с=толькоБег?`<div class="карта"><span class="время">${p.бег.время}</span><h3>${p.бег.название}</h3><p class="описание"><b>Структура</b><br>${p.бег.структура}<br><br><b>Дистанция:</b> ${p.бег.дистанция}<br><b>Интенсивность:</b> ${p.бег.интенсивность}<br><b>Цель:</b> ${p.бег.цель}</p><button class="главная-кнопка" onclick="закрытьДиалог();интервальныйТаймер(${d.getDay()})">ЗАПУСТИТЬ ТАЙМЕР БЕГА</button></div>`:`<div class="карта"><div class="ряд между"><div><span class="время">${p.место}</span><h3>${p.название}</h3></div><span class="плашка">${p.длительность} мин</span></div><p class="описание">${p.блоки.map(x=>x.join(' — ')).join('<br>')}</p>${p.упр.map(упрРазметка).join('')}${p.упр.length?`<button class="главная-кнопка" onclick="закрытьДиалог();начать(${d.getDay()},0)">НАЧАТЬ ТРЕНИРОВКУ</button>`:''}</div>`;открытьДиалог(`<div class="ряд между"><h2 style="margin:0">${d.getDate()} ${мес[d.getMonth()]}</h2><button class="иконка-кнопка" onclick="закрытьДиалог()">×</button></div>${с}`)}
function упрРазметка(x){return `<div class="раздел-упр"><h3>${x[0]}</h3><div class="параметры"><span><b>${x[1]}</b><br>подходы</span><span><b>${x[2]}</b><br>повторы</span><span><b>${x[3]}</b><br>вес</span><span><b>${x[4]}/10</b><br>интенсивность</span><span><b>${x[5]}</b><br>отдых</span><span><b>${x[6]}</b><br>темп</span></div><p class="описание"><b>Техника:</b> ${x[7]}<br><b>Цель:</b> ${x[8]}</p></div>`}
function открытьДиалог(h){document.getElementById('окно').innerHTML=h;document.getElementById('диалог').classList.add('открыт')}
function закрытьДиалог(){document.getElementById('диалог').classList.remove('открыт')}
function начатьВыбор(){let p=сегодняПрограмма();if(!p.упр.length){увед('Сегодня день отдыха');return}открытьДиалог(`<div class="ряд между"><h2 style="margin:0">Что выполняем?</h2><button class="иконка-кнопка" onclick="закрытьДиалог()">×</button></div><div class="список-карта" onclick="закрытьДиалог();интервальныйТаймер(${new Date().getDay()})"><div class="круг">🏃</div><div><b>Утренний бег</b><small>${p.бег.название}</small></div></div><div class="список-карта" onclick="закрытьДиалог();начать(${new Date().getDay()},0)"><div class="круг">${значок(p.место)}</div><div><b>Вечерняя тренировка</b><small>${p.название}</small></div></div>`)}
function начать(день,индекс){if(!программа[день]?.упр?.length){увед('На сегодня силовая тренировка не запланирована');return}сеанс={день,индекс,подход:1,начало:Date.now(),выполнено:[]};показатьУпр()}
function показатьУпр(){let p=программа[сеанс.день],u=p.упр[сеанс.индекс],всего=parseInt(u[1])+(u[1].includes('+')?parseInt(u[1].split('+')[1]):0);let доля=Math.min(100,сеанс.подход/всего*100);document.getElementById('режим').innerHTML=`<div class="трен-шапка"><button class="иконка-кнопка" onclick="выйтиИзТрен()">×</button><b>${сеанс.индекс+1} из ${p.упр.length}</b><span class="мини">${Math.round((Date.now()-сеанс.начало)/60000)} мин</span></div><div style="padding:0 18px 28px;max-width:680px;margin:auto"><div class="схема">${сеанс.день%2?'🏋️':'⚡'}</div><span class="время">${p.название}</span><h1>${u[0]}</h1><div class="подход-круг" style="--доля:${доля}%"><strong>${сеанс.подход}/${всего}</strong></div><div class="сетка"><div class="показатель"><strong>${u[2]}</strong><span>повторения</span></div><div class="показатель"><strong>${u[3]}</strong><span>рабочий вес</span></div><div class="показатель"><strong>${u[5]}</strong><span>отдых</span></div><div class="показатель"><strong>${u[4]}/10</strong><span>интенсивность</span></div></div><p class="описание"><b>Темп:</b> ${u[6]}<br><b>Техника:</b> ${u[7]}<br><b>Цель:</b> ${u[8]}</p><button class="главная-кнопка" onclick="подходГотов()">ВЫПОЛНЕНО</button><div class="кнопки" style="margin-top:9px"><button class="втор-кнопка" onclick="изменитьПодход()">Изменить</button><button class="втор-кнопка" onclick="добавитьПодход()">Добавить подход</button><button class="втор-кнопка" onclick="пропуститьУпр()">Пропустить</button><button class="втор-кнопка" onclick="следУпр()">Следующее</button></div></div>`;document.getElementById('режим').classList.add('открыт')}
function подходГотов(){let u=программа[сеанс.день].упр[сеанс.индекс],всего=parseInt(u[1])+(u[1].includes('+')?parseInt(u[1].split('+')[1]):0);сеанс.выполнено.push({упражнение:u[0],подход:сеанс.подход,повторы:u[2],вес:u[3]});if(сеанс.подход>=всего)следУпр();else{сеанс.подход++;запуститьОтдых(числоОтдыха(u[5]))}}
function числоОтдыха(s){if(!s||s==='0:00'||s==='0 с'||s.includes('без отдыха'))return 0;if(s.includes(':')){let[m,sec]=s.split(':');return parseInt(m)*60+parseInt(sec)}if(s.includes('мин'))return parseFloat(s.replace(',','.'))*60;if(s.includes('с'))return parseInt(s);return данные.отдых}
function запуститьОтдых(sec){осталось=Math.round(sec);пауза=false;document.getElementById('режим').innerHTML=`<div class="трен-шапка"><button class="иконка-кнопка" onclick="пропуститьТаймер()">×</button><b>Отдых</b><span></span></div><div style="padding:35px 18px;max-width:600px;margin:auto;text-align:center"><div class="круг" style="width:92px;height:92px;margin:auto;font-size:35px">◷</div><div id="цифры" class="таймер">${формат(осталось)}</div><p class="подзаг">Следующий подход ${сеанс.подход}</p><div class="кнопки"><button id="паузаКн" class="втор-кнопка" onclick="паузаТаймера()">Пауза</button><button class="втор-кнопка" onclick="пропуститьТаймер()">Пропустить</button><button class="втор-кнопка" onclick="изменитьВремя(15)">+15 секунд</button><button class="втор-кнопка" onclick="изменитьВремя(-15)">−15 секунд</button></div></div>`;clearInterval(таймер);таймер=setInterval(()=>{if(!пауза){осталось--;let e=document.getElementById('цифры');if(e)e.textContent=формат(Math.max(0,осталось));if(осталось<=0){clearInterval(таймер);сигнал();показатьУпр()}}},1000)}
function формат(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function паузаТаймера(){пауза=!пауза;let b=document.getElementById('паузаКн');if(b)b.textContent=пауза?'Продолжить':'Пауза'}function изменитьВремя(n){осталось=Math.max(0,осталось+n);document.getElementById('цифры').textContent=формат(осталось)}function пропуститьТаймер(){clearInterval(таймер);показатьУпр()}
function сигнал(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.35)}catch(e){}if(navigator.vibrate)navigator.vibrate([180,80,180])}
function следУпр(){if(сеанс.индекс>=программа[сеанс.день].упр.length-1){завершитьТрен()}else{сеанс.индекс++;сеанс.подход=1;показатьУпр()}}
function пропуститьУпр(){следУпр()}function добавитьПодход(){увед('Дополнительный подход добавлен');сеанс.подход=Math.max(1,сеанс.подход-1);показатьУпр()}
function изменитьПодход(){let u=программа[сеанс.день].упр[сеанс.индекс];открытьДиалог(`<h2>Изменить подход</h2><div class="форма"><div class="поле"><label>Повторения</label><input id="измПов" value="${u[2]}"></div><div class="поле"><label>Рабочий вес</label><input id="измВес" value="${u[3]}"></div><button class="главная-кнопка" onclick="применитьИзм()">Сохранить</button></div>`)}function применитьИзм(){let u=программа[сеанс.день].упр[сеанс.индекс];u[2]=document.getElementById('измПов').value;u[3]=document.getElementById('измВес').value;закрытьДиалог();показатьУпр()}
function выйтиИзТрен(){if(confirm('Завершить текущий сеанс без отметки выполнения?')){clearInterval(таймер);document.getElementById('режим').classList.remove('открыт')}}
function завершитьТрен(){let дл=Math.max(1,Math.round((Date.now()-сеанс.начало)/60000)),k=датаКлюч();данные.завершено[k]=true;данные.история.unshift({дата:k,название:программа[сеанс.день].название,тип:'основная',длительность:дл,подходы:сеанс.выполнено});сохранить();document.getElementById('режим').innerHTML=`<div style="padding:90px 20px;text-align:center;max-width:600px;margin:auto"><div style="font-size:80px">🏆</div><h1>Тренировка выполнена</h1><p class="подзаг">${сеанс.выполнено.length} подходов • ${дл} мин<br>Данные сохранены в истории</p><button class="главная-кнопка" onclick="закрытьИтог()">ГОТОВО</button></div>`;сигнал();сохранить();отрисовать()}
function закрытьИтог(){document.getElementById('режим').classList.remove('открыт');перейти('главная')}
function интервальныйТаймер(день){let p=программа[день];сеанс={бег:true,день,начало:Date.now()};осталось=60;пауза=false;document.getElementById('режим').classList.add('открыт');document.getElementById('режим').innerHTML=`<div class="трен-шапка"><button class="иконка-кнопка" onclick="выйтиБег()">×</button><b>Таймер бега</b><span>🏃</span></div><div style="padding:25px 18px;max-width:600px;margin:auto;text-align:center"><span class="время">${p.бег.название}</span><h2>${p.бег.дистанция}</h2><div id="бегФаза" class="метка" style="background:var(--линия);color:var(--текст)">РАБОЧИЙ ОТРЕЗОК</div><div id="цифрыБег" class="таймер">01:00</div><div class="кнопки"><button id="бегПауза" class="втор-кнопка" onclick="паузаБег()">Пауза</button><button class="втор-кнопка" onclick="сменитьФазу()">Следующая фаза</button><button class="втор-кнопка" onclick="бегВремя(15)">+15 секунд</button><button class="втор-кнопка" onclick="бегВремя(-15)">−15 секунд</button></div><p class="описание">${p.бег.структура}<br><br>${p.бег.интенсивность}</p><button class="главная-кнопка" onclick="завершитьБег()">ЗАВЕРШИТЬ БЕГ</button></div>`;запускБегИнтервала()}
let фазаРабота=true;function запускБегИнтервала(){clearInterval(таймер);таймер=setInterval(()=>{if(!пауза){осталось--;let e=document.getElementById('цифрыБег');if(e)e.textContent=формат(Math.max(0,осталось));if(осталось<=0){сигнал();сменитьФазу()}}},1000)}
function сменитьФазу(){фазаРабота=!фазаРабота;осталось=фазаРабота?60:120;document.getElementById('бегФаза').textContent=фазаРабота?'РАБОЧИЙ ОТРЕЗОК':'ВОССТАНОВЛЕНИЕ';document.getElementById('цифрыБег').textContent=формат(осталось)}function паузаБег(){пауза=!пауза;document.getElementById('бегПауза').textContent=пауза?'Продолжить':'Пауза'}function бегВремя(n){осталось=Math.max(0,осталось+n);document.getElementById('цифрыБег').textContent=формат(осталось)}
function завершитьБег(){clearInterval(таймер);let p=программа[сеанс.день],дл=Math.max(1,Math.round((Date.now()-сеанс.начало)/60000));данные.история.unshift({дата:датаКлюч(),название:p.бег.название,тип:'бег',длительность:дл,дистанция:p.бег.дистанция,подходы:[]});сохранить();document.getElementById('режим').classList.remove('открыт');увед('Пробежка сохранена');отрисовать()}
function выйтиБег(){clearInterval(таймер);document.getElementById('режим').classList.remove('открыт')}
function историяРазметка(){if(!данные.история.length)return '<div class="карта"><h3>История пока пуста</h3><p class="описание">Первая завершённая тренировка появится здесь автоматически.</p></div>';return данные.история.map((x,i)=>`<div class="список-карта" onclick="историяДетали(${i})"><div class="круг">${x.тип==='бег'?'🏃':'✓'}</div><div><b>${x.название}</b><small>${x.дата} • ${x.длительность} мин • ${x.подходы?.length||0} подходов</small></div><span class="стрелка">›</span></div>`).join('')}
function историяДетали(i){let x=данные.история[i];открытьДиалог(`<div class="ряд между"><h2 style="margin:0">${x.название}</h2><button class="иконка-кнопка" onclick="закрытьДиалог()">×</button></div><p class="описание">${x.дата} • ${x.длительность} мин ${x.дистанция?'• '+x.дистанция:''}</p>${x.подходы?.map(a=>`<div class="раздел-упр"><b>${a.упражнение}</b><div class="мини">Подход ${a.подход} • ${a.повторы} • ${a.вес}</div></div>`).join('')||''}`)}
function добавитьВес(){let v=parseFloat(document.getElementById('новыйВес').value);if(!v||v<30||v>200)return увед('Введите корректную массу');данные.вес.push({дата:датаКлюч(),значение:v});сохранить();отрисовать();увед('Масса сохранена')}
function графики(){нарисовать('графикВеса',данные.вес.map(x=>x.значение),'#ff5a36');let arr=[];for(let w=7;w>=0;w--){let c=0;данные.история.forEach(x=>{let раз=(Date.now()-new Date(x.дата))/86400000;if(раз>=w*7&&раз<(w+1)*7)c++});arr.push(c)}нарисовать('графикТрен',arr,'#3978f6')}
function нарисовать(id,vals,color){let c=document.getElementById(id);if(!c)return;let x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--линия');x.lineWidth=2;for(let i=1;i<5;i++){x.beginPath();x.moveTo(35,i*h/5);x.lineTo(w-10,i*h/5);x.stroke()}if(!vals.length)return;let min=Math.min(...vals),max=Math.max(...vals);if(max===min){max+=1;min-=1}x.strokeStyle=color;x.lineWidth=7;x.lineCap='round';x.lineJoin='round';x.beginPath();vals.forEach((v,i)=>{let px=35+i*(w-55)/Math.max(1,vals.length-1),py=h-30-(v-min)/(max-min)*(h-65);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();vals.forEach((v,i)=>{let px=35+i*(w-55)/Math.max(1,vals.length-1),py=h-30-(v-min)/(max-min)*(h-65);x.fillStyle=color;x.beginPath();x.arc(px,py,7,0,Math.PI*2);x.fill()})}
function изменитьРекорд(k){let v=prompt('Новое значение для «'+k+'»',данные.рекорды[k]);if(v){данные.рекорды[k]=v;сохранить();отрисовать();увед('🏆 Новый рекорд сохранён')}}function новыйРекорд(){let k=prompt('Название дисциплины');if(!k)return;let v=prompt('Результат');if(v){данные.рекорды[k]=v;сохранить();отрисовать();увед('🏆 Новый рекорд сохранён')}}
function сохранитьПитание(){данные.питание={масса:данные.вес.at(-1)?.значение||67,цель:+пЦель.value,калории:+пКал.value,белки:+пБел.value,жиры:+пЖир.value,углеводы:+пУгл.value,вода:+пВода.value};сохранить();увед('Питание сохранено')}
function сохранитьВосстановление(){данные.восстановление.push({дата:датаКлюч(),сон:+document.getElementById('сон').value,качество:+document.getElementById('качество').value,энергия:+document.getElementById('энергия').value,усталость:+document.getElementById('усталость').value});сохранить();увед('Восстановление сохранено')}
function тема(){данные.тема=данные.тема==='dark'?'light':'dark';сохранить();отрисовать()}document.getElementById('быстраяТема').onclick=тема;
async function уведомления(){if(!('Notification'in window)){увед('Браузер не поддерживает уведомления');return}if(!данные.уведомления){let r=await Notification.requestPermission();данные.уведомления=r==='granted';if(данные.уведомления)new Notification('Атлет 7',{body:'Напоминания о беге, тренировке, воде и сне включены'})}else данные.уведомления=false;сохранить();отрисовать()}
function экспорт(){let b=new Blob([JSON.stringify(данные,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='атлет-7-резервная-копия.json';a.click();URL.revokeObjectURL(a.href);увед('Резервная копия создана')}
document.getElementById('импортФайл').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{данные=Object.assign({},начальные,JSON.parse(r.result));сохранить();отрисовать();увед('Данные восстановлены')}catch(x){увед('Файл не удалось прочитать')}};r.readAsText(f)};
function сброс(){if(confirm('Удалить историю, рекорды, массу и все настройки?')){localStorage.removeItem(КЛЮЧ);данные=structuredClone(начальные);сохранить();отрисовать();увед('Прогресс сброшен')}}
